pico_bridge:
  ros__parameters:
    # Prefer the udev symlink so a replugged Pico keeps the same path
    port: "/dev/scout2map_pico"
    baudrate: 115200

    # TF frame the sensor readings are attributed to
    frame_id: "sensor_fusion"

    snapshot_rate_hz: 5.0
    status_rate_hz: 1.0

    # Mirror every raw MCU line to /sensors/raw_json, useful during bring-up
    publish_raw_json: false

    # A cached value older than this is marked invalid in the snapshot
    stale_ambient_s: 3.0        # AHT21 publishes at 1Hz
    stale_illuminance_s: 1.0    # BH1750 publishes at 5Hz
    stale_air_quality_s: 3.0    # ENS160 publishes at 1Hz
    stale_particulate_s: 5.0    # PMS7003 is event driven, capped at 1Hz

    # No line within this window means the MCU link is considered down
    link_timeout_s: 3.0
