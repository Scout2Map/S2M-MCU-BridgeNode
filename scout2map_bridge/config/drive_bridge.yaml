drive_bridge:
  ros__parameters:
    # Prefer the udev symlink: both MCUs appear as /dev/ttyACM* otherwise
    port: "/dev/scout2map_drive"
    baudrate: 115200

    # TF frames
    odom_frame: "odom"
    base_frame: "base_link"
    imu_frame: "imu_link"
    range_frame: "range_link"

    # Set false when robot_localization or another node owns odom -> base_link
    publish_tf: true

    # Command repetition. The MCU stops after 300ms of silence, so this must
    # stay comfortably below that even if a few frames are lost.
    command_rate_hz: 20.0

    # No cmd_vel within this window and the bridge commands a stop itself
    command_timeout_s: 0.25

    # Clamps applied before the command goes down. The firmware clamps too,
    # but doing it here keeps the reported command honest.
    max_linear_mps: 0.20       # rated 58RPM, not the 76RPM no-load figure
    max_angular_radps: 0.80    # below the 1.67 mechanical limit, for scan quality

    # Telemetry arrives at 50Hz; this is a generous silence threshold
    link_timeout_s: 0.5
    status_rate_hz: 10.0

    # Distance sensor geometry. Change these when swapping the analog IR
    # part for the VL53L0X: that one reads 0.03 to 1.20 m.
    range_min_m: 0.04
    range_max_m: 0.30
    range_fov_rad: 0.14

    # Used only until BOOT_INFO reports the real value
    default_track_width_m: 0.24

    # Odometry trust. Encoder odometry is good in x, weaker in yaw, and
    # close to meaningless once the MCU falls back to open loop.
    odom_xy_variance: 0.001
    odom_yaw_variance: 0.01
    odom_openloop_multiplier: 100.0

    # Twist is a direct measurement rather than an integration, so it carries
    # its own error. Derived from the 1.8 mm/s speed quantum (SPEED_WINDOW=4)
    # treated as uniform quantisation noise, q^2/12.
    odom_vx_variance: 0.00000027
    odom_wz_variance: 0.0000094

    # --- Slip detection ---
    # This is a four wheel skid steer on a 140mm wheelbase, so turning drags
    # all four wheels sideways and the chassis rotates less than the geometry
    # predicts. skid_factor corrects for that; it is a property of the tyres
    # and the floor, not something derivable on paper.
    #
    # Measured 2026-08-21 on the assembled chassis, indoor hard floor:
    #   clockwise      1.471  (509 samples, 1739 deg encoder / 1183 deg IMU)
    #   anticlockwise  1.344  (585 samples, 1999 deg encoder / 1487 deg IMU)
    # The 9 percent split between directions is real and repeatable, so this
    # is their mean rather than either reading. Gyro bias was measured at
    # -0.031 deg/s and is far too small to explain it; the cause is more
    # likely left/right asymmetry in motors, loading or tyre contact.
    #
    # Re-measure after changing tyres, load or driving surface:
    #   ros2 run scout2map_bridge skid_calib
    skid_factor: 1.41

    # A drifting gyro reads as real rotation to the slip detector. Measured
    # 2026-08-21 with s2m_imu_view.py --bias, twice, ~500 samples each:
    #   run 1  -0.031 deg/s   noise sd 0.087   drift -1.8 deg/min
    #   run 2  +0.001 deg/s   noise sd 0.089   drift +0.1 deg/min
    # The sign flips between runs, so this is noise rather than a real offset:
    # the BNO055 re-zeros its own gyro whenever it detects rest. Both readings
    # sit well under the noise floor, so correcting would add error rather
    # than remove it. Zero here is a measured result, not an unset default.
    #
    # Re-measure if the BNO055 is replaced or remounted. Stop the bridge
    # first, the tool opens the serial port directly:
    #   python3 tools/s2m_imu_view.py --bias -p /dev/scout2map_drive
    gyro_bias_radps: 0.0

    # --- Battery ---
    # 3S 5250mAh LiPo. There is no current shunt on this board, so state of
    # charge is interpolated from pack voltage against the curve below. It is
    # a gauge, not a fuel meter: voltage sags under motor load, so the reading
    # runs pessimistic while driving and recovers seconds after stopping.
    battery_cells: 3
    battery_capacity_ah: 5.25
    battery_estimate_soc: true

    # Seconds. Without smoothing the estimate swings tens of percent every
    # time the motors start and stop.
    battery_smoothing_s: 10.0

    # Per-cell volts, descending, paired index-wise with battery_curve_soc.
    # Points bunch up near 3.7V because that is where the LiPo knee is; a
    # coarse table there reads badly wrong.
    battery_curve_cell_v: [4.20, 4.10, 4.00, 3.95, 3.87, 3.83,
                           3.79, 3.75, 3.71, 3.65, 3.50, 3.30]
    battery_curve_soc:    [1.00, 0.90, 0.80, 0.70, 0.60, 0.50,
                           0.40, 0.30, 0.20, 0.10, 0.05, 0.00]

    # Below these the comparison is noise dividing into noise
    slip_rate_floor_radps: 0.10
    slip_min_wheel_speed_mps: 0.02
